name: litellm-gateway

services:
  litellm:
    image: ghcr.io/berriai/litellm:latest
    restart: unless-stopped
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm-dev-password}@postgres:5432/${POSTGRES_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-master-key-change-me}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-admin}
      STORE_MODEL_IN_DB: ${STORE_MODEL_IN_DB:-True}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      TGI_API_BASE: ${TGI_API_BASE:-http://tgi:8080}
    expose:
      - "4000"
    ports:
      - "127.0.0.1:${LITELLM_HOST_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - gateway

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-dev@example.local}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:-admin}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:-not-used-in-dev}
    ports:
      - "${CADDY_HTTP_PORT:-8081}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - gateway

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway

  ollama:
    image: ollama/ollama:latest
    profiles:
      - local-models
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gateway

networks:
  gateway:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  ollama_data:
