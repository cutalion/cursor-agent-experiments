# LiteLLM proxy configuration.
# Reference: https://docs.litellm.ai/docs/proxy/configs
#
# Convention used here:
#   • `os.environ/FOO` tells LiteLLM to read the secret from the FOO env var
#     at request time. Never hard-code provider keys in this file.
#   • `model_name` is the public alias clients use (e.g. "gpt-4o-mini").
#   • `model` (under litellm_params) is the upstream provider/model id.
#
# Add or remove entries below to match what you want to expose.

model_list:
  # ── OpenAI ──────────────────────────────────────────────────────────
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # ── Anthropic ───────────────────────────────────────────────────────
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-latest
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── Groq (fast OSS hosting) ─────────────────────────────────────────
  - model_name: groq-llama-3.1-70b
    litellm_params:
      model: groq/llama-3.1-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # ── Self-hosted Ollama (uncomment after enabling the ollama overlay)
  # - model_name: ollama-llama3
  #   litellm_params:
  #     model: ollama/llama3
  #     api_base: http://ollama:11434

  # ── Self-hosted TGI (HuggingFace text-generation-inference) ─────────
  # - model_name: tgi-mistral
  #   litellm_params:
  #     model: huggingface/mistralai/Mistral-7B-Instruct-v0.3
  #     api_base: http://tgi:8080

# Global LiteLLM behaviour.
litellm_settings:
  drop_params: true        # Silently drop params upstreams don't support
  num_retries: 3
  request_timeout: 600
  set_verbose: false
  telemetry: false
  json_logs: true          # Structured logs play nicely with Loki/Datadog
  # Add a Redis overlay and uncomment to enable response caching:
  # cache: true
  # cache_params:
  #   type: redis
  #   host: redis
  #   port: 6379
  # success_callback: ["langfuse"]   # Add observability sinks here
  # failure_callback: ["langfuse"]

# Server-wide settings.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Uncomment to persist virtual API keys, usage and budgets in Postgres
  # (compose with ./compose/postgres.yml or set DATABASE_URL externally):
  # database_url: os.environ/DATABASE_URL
  # store_model_in_db: true

  # Allow listing /v1/models without a key (handy for SDKs that probe).
  allow_unauthenticated_model_list: false

  # Default per-team / per-key limits — override with virtual keys.
  # max_budget: 100
  # budget_duration: 30d

  # Health check pinging upstreams; off by default to avoid spend.
  background_health_checks: false

# Routing — load-balance, fallback, etc. Useful as the catalog grows.
router_settings:
  routing_strategy: simple-shuffle    # latency-based-routing | least-busy | usage-based
  # Once you add a Redis overlay, set `redis_host: redis` so multiple
  # litellm replicas share rate-limit state.
  # fallbacks:
  #   - gpt-4o-mini: ["claude-3-5-sonnet"]
  # context_window_fallbacks:
  #   - gpt-4o-mini: ["gpt-4o"]
