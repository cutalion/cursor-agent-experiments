# Optional Ollama extension.
# Merge with: docker compose -f docker-compose.yml -f docker-compose.ollama.yml up
version: "3.9"

volumes:
  ollama_data:

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - gateway
    # Uncomment to use GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  litellm:
    # Override the config to add Ollama models when this file is merged
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ./litellm-config.ollama.yaml:/app/config.ollama.yaml:ro
    command: ["--config", "/app/config.ollama.yaml", "--port", "4000"]
    depends_on:
      ollama:
        condition: service_healthy
