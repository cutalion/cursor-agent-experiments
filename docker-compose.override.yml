### Development overrides — auto-loaded by `docker compose up`.
###
### Differences from prod:
###   • Expose litellm on host :4000 for direct curl/SDK access
###   • Caddy listens on :8080 (plain HTTP) instead of 80/443/UDP
###   • Verbose litellm logging
###
### Requires Docker Compose >= 2.24 for the `!override` tag. If your
### compose is older, comment out the override and edit ports manually
### or run `docker compose -f docker-compose.yml ...` (prod mode).

services:
  litellm:
    ports:
      - "4000:4000"
    environment:
      LITELLM_MODE: DEVELOPMENT
      LITELLM_LOG: DEBUG
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --detailed_debug

  caddy:
    ports: !override
      - "8080:8080"
    depends_on:
      litellm:
        condition: service_started
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
