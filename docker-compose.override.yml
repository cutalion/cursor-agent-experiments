services:
  litellm:
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-dev-master-key-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-dev-salt-key-change-me}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro

  caddy:
    ports:
      - "${DEV_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
